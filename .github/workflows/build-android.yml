name: Build Android APK

on:
  push:
    branches: [main, claude/fix-apk-build-github-Q1Fy1, claude/v28-hardened-build]
    paths:
      - 'index.html'
      - 'android/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # v31: حاجز ضدّ تكرار خطأ v28 (renderSalLaw)
      # نتحقق أن السكربت في index.html يُعرَب بنجاح في محرّك V8 الحقيقي
      # قبل أي بناء — إذا فشل، نوقف الـ pipeline فوراً
      - name: Validate index.html JavaScript syntax
        run: |
          set -e
          # استخراج كل ما داخل <script> الكبير (السكربت الرئيسي)
          python3 - <<'PYEOF'
          with open('index.html', 'r', encoding='utf-8') as f:
              html = f.read()
          lines = html.split('\n')
          start = end = None
          for i, line in enumerate(lines):
              if start is None and '<script>' in line and i > 3000:
                  start = i + 1
              elif start and '</script>' in line:
                  end = i
                  break
          if start is None or end is None:
              raise SystemExit('main <script> block not found in index.html')
          with open('/tmp/script_block.js', 'w', encoding='utf-8') as f:
              f.write('\n'.join(lines[start:end]))
          print(f'Extracted main script: lines {start}-{end} ({end-start} lines)')
          PYEOF
          # تحقّق فعلي بـ V8 (نفس محرّك WebView في Android)
          node -e "
            const fs = require('fs');
            const vm = require('vm');
            try {
              new vm.Script(fs.readFileSync('/tmp/script_block.js', 'utf-8'));
              console.log('✅ index.html JS parses cleanly in V8');
            } catch(e) {
              console.error('❌ index.html JS has syntax error:', e.message);
              const m = e.stack.match(/anonymous>:(\\d+)/);
              if(m) console.error('At line ~' + m[1] + ' of extracted script');
              process.exit(1);
            }
          "

      - name: Install Jest dependencies
        run: npm ci --no-audit --no-fund

      - name: Run Jest unit tests
        run: npm test -- --silent

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check connectivity and environment
        run: |
          echo "## Diagnostics" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_STEP_SUMMARY
          echo "Java: $(java -version 2>&1 | head -1)" >> $GITHUB_STEP_SUMMARY
          GM=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "https://dl.google.com/dl/android/maven2/com/android/tools/build/gradle/8.5.2/gradle-8.5.2.pom")
          echo "Google Maven (dl.google.com): $GM" >> $GITHUB_STEP_SUMMARY
          GM2=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "https://maven.google.com/com/android/tools/build/gradle/8.5.2/gradle-8.5.2.pom")
          echo "Google Maven (maven.google.com): $GM2" >> $GITHUB_STEP_SUMMARY
          GR=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "https://services.gradle.org/distributions/gradle-8.7-bin.zip")
          echo "Gradle distribution: $GR" >> $GITHUB_STEP_SUMMARY
          ls ${ANDROID_SDK_ROOT}/platforms/ 2>/dev/null >> $GITHUB_STEP_SUMMARY || echo "no platforms" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          SDKMANAGER=$(find "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" -name "sdkmanager" -type f 2>/dev/null | head -1)
          [ -n "$SDKMANAGER" ] && yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true

      - name: Create local.properties
        run: echo "sdk.dir=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" > android/local.properties

      - name: Sync latest index.html into Android assets
        run: cp index.html android/app/src/main/assets/public/index.html

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: v2-gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: v2-gradle-

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log
          exit ${PIPESTATUS[0]}

      - name: Show build error in summary
        if: failure()
        run: |
          echo "## Build Error" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -A 20 "FAILURE\|What went wrong\|Could not\|error:" /tmp/build.log | head -60 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: /tmp/build.log

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rayhana-cafe-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Publish APK to v53 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v53
          name: ريحانة كافيه v53.0.0
          prerelease: false
          files: android/app/build/outputs/apk/debug/*.apk
          body: |
            ## ريحانة كافيه — الإصدار v53.0.0 🧑‍💼 (مستشار حقيقي يفكّر بالأرقام)

            ### المستشار صار خبير كافيهات فعلياً (لا قوالب جاهزة)
            محرك تشخيص يفحص بياناتك ويُنتج تقريراً مرتّباً بالأولوية:
            - 🔢 **يُكمّم كل مشكلة بالـ JD/شهر** ويرتّبها (الأكبر أثراً أولاً) + مجموع الفرصة الشهرية
            - 🔗 **يربط الأسباب**: مثال «تكلفة بضاعتك 54٪ — السبب المرجّح: مورد X ارتفعت فاتورته 40٪»
            - 📐 **بمعايير القطاع العالمية**: بضاعة 28–35٪ · عمالة ≤30٪ · التكلفة الأولية (Prime) ≤60٪ · هامش 15–20٪
            - 🧮 **رياضيات عادلة**: يقيس التكاليف الثابتة (الرواتب) مقابل البيع الشهري المتوقّع لا أيام معدودة
            - يكشف: خسارة، عجز/فائض صندوق، التزامات معلّقة، متفرقات مرتفعة، تراجع داخل الشهر، يوم أسبوع ضعيف، تركّز مورّد، ومنتجات مسعّرة بأقل من تكلفتها — مع **قرار عملي مُكمَّم لكل بند**

            اسأله: «شخّص وضعي» · «ما المشاكل؟» · «حلّل وأعطني خطة» — أو استخدم زر **🩺 شخّص وضعي**. يعمل أوفلاين بلا أي مفتاح، ويجيب الأسئلة المحدّدة من بياناتك مباشرةً.

            ### من v52
            - تبويب الإعدادات الموحّد · دليل البدء · المنيو والتسعير

            ### ⚠️ التثبيت
            1. **احذف القديم** ثم ثبّت `rayhana-cafe-v53.0.0-debug.apk`
            2. تأكّد من ظهور **«الإصدار v53»** أعلى لوحة التحكم
            3. كلمة المرور: **1234**

            ### المتطلبات: Android 8.0+
            ## (أرشيف) v52.0.0 🧭

            ### تنظيم وإعدادات
            - ⚙️ **تبويب «الإعدادات» موحّد**: كلمة المرور · النسخ الاحتياطي · المزامنة السحابية · المستشار الذكي · المخزون · التقرير السنوي · سجل التعديلات — كلها في مكان واحد
            - 🔎 **اكتشاف الأقسام**: أقسام كانت مخفية (المخزون، السنوي) صارت ظاهرة في الإعدادات
            - 🧹 نقل «سجل التعديلات» إلى الإعدادات لتخفيف الشريط العلوي

            ### دليل البدء (Onboarding)
            - 🚀 **قائمة إعداد موجَّهة** على لوحة التحكم للمستخدم الجديد: التزامات · موظفون · هدف · أول إيراد · منيو · سحابة — كل خطوة تنقلك لمكانها وتُعلَّم تلقائياً عند إنجازها (قابلة للإخفاء، وتُفتح من الإعدادات)

            ### إضافة
            - ☕ **تبويب المنيو والتسعير** (هندسة المنيو): أسعار وتكاليف المنتجات + تصنيف نجوم/أحصنة/ألغاز/كلاب + هامش كل منتج

            ### من v51
            - إصلاح تعطّل المستشار (تكرار لا نهائي) · مقارنة الأيام بالشهر الماضي · مقارنة الفطر/الأضحى · Excel أوفلاين

            ### ⚠️ التثبيت
            1. **احذف النسخة القديمة أولاً** ثم ثبّت `rayhana-cafe-v52.0.0-debug.apk`
            2. تأكّد أن أعلى لوحة التحكم يظهر **«الإصدار v52»**
            3. كلمة المرور: **1234**

            ### المتطلبات: Android 8.0+
            ## (أرشيف) v51.0.0 🛠️

            ### 🔴 إصلاح حرج
            - **المستشار الذكي كان يتعطّل** (تكرار لا نهائي) في كثير من الأسئلة منذ v47 — أُصلح الآن، ومساعد المحادثة العربي يعمل فعلاً ويجيب من بياناتك

            ### ➕ جديد (طلب المستخدم)
            - 📆 **مقارنة الأيام مع الشهر الماضي** يوماً بيوم (في تبويب التحليل الذكي) مع الفروقات
            - ⚖️ **مقارنة عيد الفطر مقابل الأضحى** (متوسط اليوم) إضافةً لمقارنة العيد عبر السنوات
            - 📗 **Excel احترافي يعمل أوفلاين بالكامل** (ملف .xls منسّق بلا إنترنت ولا مكتبة)
            - 🔢 **رقم الإصدار ظاهر** أعلى لوحة التحكم لتتأكد من نسختك

            ### تذكير: الميزات الموجودة منذ v45–v50
            - تبويب «🧠 التحليل الذكي»: مساعد محادثة · تنبؤ موسمي · محاكي قرارات · تحليل المتفرقات · كشف الشذوذ · ميزانية وتنبيهات · معايير القطاع
            - مقارنة الموردين بالشهر السابق (تبويب الموردون)

            ### ⚠️ مهم للتثبيت
            1. **احذف النسخة القديمة أولاً** ثم ثبّت `rayhana-cafe-v51.0.0-debug.apk`
            2. افتح التطبيق وتأكّد أن أعلى لوحة التحكم يظهر **«الإصدار v51»**
            3. كلمة المرور: **1234**

            ### المتطلبات: Android 8.0+
            ## (أرشيف) v50.0.0 📊 (ميزانية وتنبيهات استباقية)

            ### الميزانية والتنبيهات الاستباقية (في تبويب التحليل الذكي)
            - حدّد سقف كل فئة (إيراد/بضاعة/رواتب/مصاريف عامة)
            - أشرطة تتبّع حيّة + **تنبيه استباقي**: يحذّرك *قبل* تجاوز الميزانية بناءً على وتيرة الصرف الحالية وإسقاطها لنهاية الشهر
            - (كانت هذه الميزة معطّلة بالكامل في الإصدارات السابقة — أُصلحت حساباتها ورُبطت بواجهة حقيقية)

            ### من v49
            - مساعد محادثة بالعربية يجيب من بياناتك مباشرةً (أوفلاين)

            ## ريحانة كافيه — الإصدار v49.0.0 💬 (مساعد محادثة)

            ### مساعد محادثة بالعربية على بياناتك (أوفلاين)
            اسأل المستشار بلغتك الطبيعية وسيجيب من بياناتك مباشرةً:
            - «أفضل/أسوأ يوم» · «يوم 15» · «متوسط البيع» · «كم بعت هذا الشهر»
            - «من أكثر مورد أخذ مني» · «كم صرفت على المتفرقات/الرواتب/البضاعة»
            - «كم باقي للهدف» · «كم يوم أدخلت» · متوسط أي يوم أسبوع («الثلاثاء»)
            يعمل بلا إنترنت ولا مفتاح، ويُكمل بالتحليل العام إن لم يكن السؤال محدداً.

            ### من v48
            - تحليل المتفرقات + كشف الشذوذ الذكي (الوسيط)

            ## ريحانة كافيه — الإصدار v48.0.0 🔬 (تحليل عميق)

            ### جديد في «🧠 التحليل الذكي»
            - 🧾 **تحليل المتفرقات (أخرى)**: يكشف *ما هي* مشترياتك غير المصنّفة فعلاً — تفصيل بالبنود والموردين، مقارنة بالشهر السابق، وتوصية ذكية لإعادة التصنيف عند ارتفاعها
            - 🔍 **كشف الشذوذ الذكي**: يرصد الأيام والمشتريات غير الاعتيادية بطريقة الوسيط (robust) — أيام مرتفعة/منخفضة بشكل لافت وفواتير أكبر من المعتاد بـ3 أضعاف

            ### من v47
            - تبويب التحليل الذكي: ملخص تنفيذي سردي · تنبؤ بموسمية أيام الأسبوع · محاكي قرارات · مقارنة أعياد · معايير القطاع
            - تقرير PDF تنفيذي احترافي

            ### تبويب جديد: «🧠 التحليل الذكي» — يعمل أوفلاين بالكامل بلا أي مفتاح
            - 📋 **ملخص تنفيذي سردي**: يكتب «قصة الشهر» بالعربية كما يفعل مدير مالي (أداء، مقارنة بالسابق، أقوى الأيام، أبرز المخاطر)
            - 🔮 **تنبؤ ذكي بموسمية أيام الأسبوع**: يتوقّع إغلاق الشهر بناءً على متوسط كل يوم أسبوع من آخر 3 أشهر
            - 🎚️ **محاكي القرارات (ماذا لو؟)**: شرائح تفاعلية — رفع الأسعار، خفض تكلفة البضاعة، موظف إضافي، زبائن إضافيون — وترى الأثر الفوري على الربح
            - 📅 **تحليلات موسمية**: ترتيب أيام الأسبوع، مقارنة الأعياد عبر السنوات، وتوصية جدولة الموظفين
            - 🎯 **معايير قطاع الكافيهات**: تكلفة البضاعة/العمالة/التكلفة الأولية/الهامش مقابل المعايير العالمية

            ### تقرير PDF تنفيذي احترافي
            - بطاقات مؤشرات أعلى التقرير + ملخص تنفيذي + مقارنة بمعايير القطاع — يليق بعرضه على محاسب أو مستثمر

            ### من v46
            - حماية بيانات (حارس التلف + دمج آمن) · صحة أرقام (بنود المصاريف الكاملة + صافي المسؤول) · إصلاحات سلامة ووظائف

            ### التثبيت
            1. حمّل `rayhana-cafe-v47.0.0-debug.apk`
            2. ثبّت فوق الإصدار السابق
            3. كلمة المرور: **1234**

            ### المتطلبات: Android 8.0+
