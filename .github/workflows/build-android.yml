            ## (أرشيف) v53.0.0 🧑‍💼 (مستشار حقيقي يفكّر بالأرقام)

            ### المستشار صار خبير كافيهات فعلياً (لا قوالب جاهزة)
            محرك تشخيص يفحص بياناتك ويُنتج تقريراً مرتّباً بالأولوية:
            - 🔢 **يُكمّم كل مشكلة بالـ JD/شهر** ويرتّبها (الأكبر أثراً أولاً) + مجموع الفرصة الشهرية
            - 🔗 **يربط الأسباب**: مثال «تكلفة بضاعتك 54٪ — السبب المرجّح: مورد X ارتفعت فاتورته 40٪»
            - 📐 **بمعايير القطاع العالمية**: بضاعة 28–35٪ · عمالة ≤30٪ · التكلفة الأولية (Prime) ≤60٪ · هامش 15–20٪
            - 🧮 **رياضيات عادلة**: يقيس التكاليف الثابتة (الرواتب) مقابل البيع الشهري المتوقّع لا أيام معدودة
            - يكشف: خسارة، عجز/فائض صندوق، التزامات معلّقة، متفرقات مرتفعة، تراجع داخل الشهر، يوم أسبوع ضعيف، تركّز مورّد، ومنتجات مسعّرة بأقل من تكلفتها — مع **قرار عملي مُكمَّم لكل بند**

            اسأله: «شخّص وضعي» · «ما المشاكل؟» · «حلّل وأعطني خطة» — أو استخدم زر **🩺 شخّص وضعي**. يعمل أوفلاين بلا أي مفتاح، ويجيب الأسئلة المحدّدة من بياناتك مباشرةً.

