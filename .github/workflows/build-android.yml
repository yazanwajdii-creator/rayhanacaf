            ## (أرشيف) v56.0.0 🎙️ (نقلة نوعية: إدخال صوتي عربي)

            ### 🌟 الميزة الكبرى: تكلّم بالعربية → التطبيق يُدخل تلقائياً

            زر مايك بنفسجي عائم (أسفل اليسار) — اضغط، تكلّم بطبيعتك، والتطبيق يفهم.
            النظام مبني على **محلّل عربي ذكي** يستخرج النية والأرقام والأسماء.

            **أمثلة جاهزة (مختبَرة):**
            - 🛒 "اشتريت من يحيى رسمي بقيمة مية" → فاتورة شراء كاملة (مورد + مبلغ)
            - 🛒 "اشتريت من احمد للخضار بألف وخمسمية" → 1500 JD، يطابق المورد آلياً
            - 💰 "اليوم كاش ثلاثمية وفيزا خمسين" → سطر إيراد اليوم (300 + 50)
            - 💰 "كاش ١٠٠" بأرقام عربية أو غربية — كلاهما يعمل
            - 💰 "امس كاش مية" → سطر إيراد البارحة
            - 💵 "سلفة لهاني عشرين دينار" → سلفة بكامل التفاصيل

            **يفهم الأرقام بكل صيغها:**
            - رقمية: ١٢٣ أو 123
            - منطوقة: واحد، خمسة، عشرة، خمستعش، عشرين، مية، ميتين، ألف
            - مركّبة: «ميتين وخمسة وعشرين» = 225، «ألفين وخمسمية» = 2500
            - مضاعفة: «خمسة آلاف» = 5000

            **كيف يعمل بأمان:**
            1. تتكلّم/تكتب → يظهر التفسير: «🛒 فاتورة شراء، المورد: يحيى رسمي، 100 JD»
            2. إن كان صحيحاً → زر «✅ تأكيد وحفظ» يصبح فعّالاً
            3. تأكيدك → يُحفظ في النظام (مع زر تراجع ↶ كأي عملية)

            **لو لم يعمل المايك على جهازك** (بعض WebViewات لا تدعم Web Speech API):
            - يظهر مربّع نصّ تكتب فيه الأمر بنفس اللغة الطبيعية، نفس النتيجة

            ### 🔒 صلاحيات
            - أُضيفت صلاحية `RECORD_AUDIO` للمايك في Android
            - أول استخدام يطلب موافقتك مرة واحدة

