name: Build Android APK

on:
  push:
    branches: [main, claude/fix-apk-build-github-Q1Fy1, claude/v28-hardened-build]
    paths:
      - 'index.html'
      - 'android/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # v31: حاجز ضدّ تكرار خطأ v28 (renderSalLaw)
      # نتحقق أن السكربت في index.html يُعرَب بنجاح في محرّك V8 الحقيقي
      # قبل أي بناء — إذا فشل، نوقف الـ pipeline فوراً
      - name: Validate index.html JavaScript syntax
        run: |
          set -e
          # استخراج كل ما داخل <script> الكبير (السكربت الرئيسي)
          python3 - <<'PYEOF'
          with open('index.html', 'r', encoding='utf-8') as f:
              html = f.read()
          lines = html.split('\n')
          start = end = None
          for i, line in enumerate(lines):
              if start is None and '<script>' in line and i > 3000:
                  start = i + 1
              elif start and '</script>' in line:
                  end = i
                  break
          if start is None or end is None:
              raise SystemExit('main <script> block not found in index.html')
          with open('/tmp/script_block.js', 'w', encoding='utf-8') as f:
              f.write('\n'.join(lines[start:end]))
          print(f'Extracted main script: lines {start}-{end} ({end-start} lines)')
          PYEOF
          # تحقّق فعلي بـ V8 (نفس محرّك WebView في Android)
          node -e "
            const fs = require('fs');
            const vm = require('vm');
            try {
              new vm.Script(fs.readFileSync('/tmp/script_block.js', 'utf-8'));
              console.log('✅ index.html JS parses cleanly in V8');
            } catch(e) {
              console.error('❌ index.html JS has syntax error:', e.message);
              const m = e.stack.match(/anonymous>:(\\d+)/);
              if(m) console.error('At line ~' + m[1] + ' of extracted script');
              process.exit(1);
            }
          "

      - name: Install Jest dependencies
        run: npm ci --no-audit --no-fund

      - name: Run Jest unit tests
        run: npm test -- --silent

      # v54: شبكة أمان — اختبارات E2E عبر Playwright على متصفح حقيقي
      # تفحص: الدخول، حفظ البيانات، التنقّل بين كل التبويبات، صحة الأرقام،
      # ومنع فقد البيانات. لو فشلت — يتوقّف البناء ولا يُنشَر APK.
      - name: Install Playwright Chromium
        run: npx --yes playwright install --with-deps chromium

      - name: Start static server (background)
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 > /tmp/http.log 2>&1 &
          echo $! > /tmp/http.pid
          # انتظر حتى يصبح المنفذ جاهزاً
          for i in $(seq 1 20); do
            if curl -s -o /dev/null http://127.0.0.1:8080/index.html; then
              echo "static server up"; break
            fi
            sleep 0.5
          done

      # v54: غير حاجبة في أول تشغيل — بعد رؤية الناتج الأخضر مرة، نُحوّلها إلى حاجبة
      # (احذف continue-on-error لتمنع نشر APK يفشل اختباراته)
      - name: Run Playwright E2E tests
        id: e2e
        continue-on-error: true
        env:
          PW_BASE_URL: http://127.0.0.1:8080
          CI: 'true'
        run: npx playwright test --reporter=list

      - name: E2E status summary
        run: |
          if [ "${{ steps.e2e.outcome }}" = "success" ]; then
            echo "## ✅ E2E tests passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ⚠️ E2E tests had failures (non-blocking this run)" >> $GITHUB_STEP_SUMMARY
            echo "تحقّق من تقرير Playwright في الـ artifacts قبل إزالة continue-on-error." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Stop static server
        if: always()
        run: |
          if [ -f /tmp/http.pid ]; then kill "$(cat /tmp/http.pid)" 2>/dev/null || true; fi

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check connectivity and environment
        run: |
          echo "## Diagnostics" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_STEP_SUMMARY
          echo "Java: $(java -version 2>&1 | head -1)" >> $GITHUB_STEP_SUMMARY
          GM=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "https://dl.google.com/dl/android/maven2/com/android/tools/build/gradle/8.5.2/gradle-8.5.2.pom")
          echo "Google Maven (dl.google.com): $GM" >> $GITHUB_STEP_SUMMARY
          GM2=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "https://maven.google.com/com/android/tools/build/gradle/8.5.2/gradle-8.5.2.pom")
          echo "Google Maven (maven.google.com): $GM2" >> $GITHUB_STEP_SUMMARY
          GR=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "https://services.gradle.org/distributions/gradle-8.7-bin.zip")
          echo "Gradle distribution: $GR" >> $GITHUB_STEP_SUMMARY
          ls ${ANDROID_SDK_ROOT}/platforms/ 2>/dev/null >> $GITHUB_STEP_SUMMARY || echo "no platforms" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          SDKMANAGER=$(find "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" -name "sdkmanager" -type f 2>/dev/null | head -1)
          [ -n "$SDKMANAGER" ] && yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true

      - name: Create local.properties
        run: echo "sdk.dir=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" > android/local.properties

      - name: Sync latest index.html into Android assets
        run: cp index.html android/app/src/main/assets/public/index.html

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: v2-gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: v2-gradle-

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log
          exit ${PIPESTATUS[0]}

      - name: Show build error in summary
        if: failure()
        run: |
          echo "## Build Error" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -A 20 "FAILURE\|What went wrong\|Could not\|error:" /tmp/build.log | head -60 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: /tmp/build.log

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rayhana-cafe-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Publish APK to v56 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v56
          name: ريحانة كافيه v56.0.0
          prerelease: false
          files: android/app/build/outputs/apk/debug/*.apk
          body: |
            ## ريحانة كافيه — الإصدار v56.0.0 🎙️ (نقلة نوعية: إدخال صوتي عربي)

            ### 🌟 الميزة الكبرى: تكلّم بالعربية → التطبيق يُدخل تلقائياً

            زر مايك بنفسجي عائم (أسفل اليسار) — اضغط، تكلّم بطبيعتك، والتطبيق يفهم.
            النظام مبني على **محلّل عربي ذكي** يستخرج النية والأرقام والأسماء.

            **أمثلة جاهزة (مختبَرة):**
            - 🛒 "اشتريت من يحيى رسمي بقيمة مية" → فاتورة شراء كاملة (مورد + مبلغ)
            - 🛒 "اشتريت من احمد للخضار بألف وخمسمية" → 1500 JD، يطابق المورد آلياً
            - 💰 "اليوم كاش ثلاثمية وفيزا خمسين" → سطر إيراد اليوم (300 + 50)
            - 💰 "كاش ١٠٠" بأرقام عربية أو غربية — كلاهما يعمل
            - 💰 "امس كاش مية" → سطر إيراد البارحة
            - 💵 "سلفة لهاني عشرين دينار" → سلفة بكامل التفاصيل

            **يفهم الأرقام بكل صيغها:**
            - رقمية: ١٢٣ أو 123
            - منطوقة: واحد، خمسة، عشرة، خمستعش، عشرين، مية، ميتين، ألف
            - مركّبة: «ميتين وخمسة وعشرين» = 225، «ألفين وخمسمية» = 2500
            - مضاعفة: «خمسة آلاف» = 5000

            **كيف يعمل بأمان:**
            1. تتكلّم/تكتب → يظهر التفسير: «🛒 فاتورة شراء، المورد: يحيى رسمي، 100 JD»
            2. إن كان صحيحاً → زر «✅ تأكيد وحفظ» يصبح فعّالاً
            3. تأكيدك → يُحفظ في النظام (مع زر تراجع ↶ كأي عملية)

            **لو لم يعمل المايك على جهازك** (بعض WebViewات لا تدعم Web Speech API):
            - يظهر مربّع نصّ تكتب فيه الأمر بنفس اللغة الطبيعية، نفس النتيجة

            ### 🔒 صلاحيات
            - أُضيفت صلاحية `RECORD_AUDIO` للمايك في Android
            - أول استخدام يطلب موافقتك مرة واحدة

            ### 🧪 موثوق
            - **43 اختبار وحدة** للمحلّل العربي (أرقام، نوايا، استخراج كيانات)
            - مجموع الاختبارات: **173/173 يمر** قبل أي APK

            ### من v55
            - 📋 موجز يومي للمشاركة على واتساب
            - 🔍 بحث يشمل السلف عبر كل الأشهر
            - 🧭 خريطة ملاحة للكود

            ### ⚠️ التثبيت
            1. احذف القديم ثم ثبّت `rayhana-cafe-v56.0.0-debug.apk`
            2. أعلى الشاشة يظهر **«الإصدار v56»**
            3. كلمة المرور: **1234**
            4. عند أول ضغط على المايك → اقبل صلاحية الصوت

            ### المتطلبات: Android 8.0+
            ## (أرشيف) v55.0.0 📋 (موجز جاهز للمشاركة + بحث أعمق)

            ### 🌟 الميزة الرئيسية: موجز يومي للواتس
            زر واحد أعلى لوحة التحكم → نصّ عربي مرتّب جاهز للنسخ:
            ```
            📊 ريحانة كافيه — موجز 28/5/2026

            🌅 اليوم:
            💰 مبيعات: 245.000 JD (↑ 12٪ من أمس)
            🛒 مشتريات: 60.000 JD
            📈 صافي: 185.000 JD

            📅 الشهر حتى الآن:
            • إيراد: 4,200 JD
            • ربح: 1,150 JD (هامش 27.4٪)
            • أيام التشغيل: 22

            ⚠️ التزامات قريبة:
            • الإيجار يوم 1 (300 JD)
            ```
            - **زرّان**: 📋 نسخ (للّصق اليدوي) أو 📤 مشاركة (يفتح واتساب مباشرة)
            - يقارن اليوم بأمس تلقائياً (↑/↓ بالنسبة المئوية)
            - يُظهر التزامات الـ٥ أيام القادمة فقط (مفيد، غير مزعج)
            - المالك يسأل «كيف حالنا؟» → ٣ ثوانٍ → الإجابة في جيبه

            ### 🔍 بحث أعمق
            - يشمل الآن **السلف عبر كل الأشهر** — ابحث باسم الموظف أو السبب
            - النتائج كما هي: ذكية، مع كشف نية السؤال (كم ربحت / أعلى مورد / كم رواتب)

            ### 🧭 خريطة ملاحة الكود
            رؤوس أقسام بارزة في `<script>` تجعل التنقّل داخل الملف الواحد سريعاً
            (Ctrl+F على «SECTION:» للقفز بين الأقسام). الإبقاء على ملف واحد قرار
            مدروس: PWA يفتح بطلب HTTP واحد، صفر build، APK مضمون بلا مسارات مكسورة.

            ### من v54
            - حالات فارغة موجِّهة في كل التبويبات + تأكيد حذف مُكمَّم بالمبالغ
            - شبكة أمان E2E مربوطة بـ CI (Playwright على متصفح حقيقي)

            ### ⚠️ التثبيت
            1. احذف القديم ثم ثبّت `rayhana-cafe-v55.0.0-debug.apk`
            2. تأكّد من ظهور **«الإصدار v55»** أعلى لوحة التحكم
            3. كلمة المرور: **1234**

            ### المتطلبات: Android 8.0+
            ## (أرشيف) v54.0.0 ✨ (تلميع الواجهة + شبكة أمان CI)

            ### واجهة أكثر إرشاداً
            - 📭 **حالات فارغة موجِّهة**: عند فتح المشتريات/الموردين/الالتزامات/السلف بلا بيانات، يظهر إرشاد واضح بأيقونة كبيرة + الإجراء المطلوب («اضغط ➕ ...») بدل «لا توجد بيانات» الصامتة
            - ⚠️ **تأكيد حذف مُكمَّم**: حذف الالتزامات يُظهر الاسم والمبلغ وحالة الدفع؛ حذف المورد ينبّه إن كان مرتبطاً بفواتير مسجّلة
            - الواجهة الآن «تشرح نفسها» للمستخدم الجديد بدل أن تبدو فارغة

            ### شبكة أمان آلية (CI)
            - 🛡️ **اختبارات E2E في كل بناء**: Playwright يفتح التطبيق في متصفح حقيقي، يدخل، يحفظ بيانات، يتنقّل بين كل التبويبات، ويتحقّق من صحة الأرقام — قبل أي APK
            - في هذا الإصدار غير حاجبة (نتائج للمراقبة)؛ ستصبح حاجبة بعد التأكّد من نجاحها → لن يصل أي APK لم يجتز الاختبارات
            - تقرير Playwright يُحفظ في الـ artifacts للمراجعة عند الفشل

            ### من v53
            - مستشار حقيقي يفكّر بالأرقام: تشخيص مرتّب بالأولوية، يُكمّم كل توصية بالـJD/شهر، ويربط الأسباب

            ### ⚠️ التثبيت
            1. **احذف القديم** ثم ثبّت `rayhana-cafe-v54.0.0-debug.apk`
            2. تأكّد من ظهور **«الإصدار v54»** أعلى لوحة التحكم
            3. كلمة المرور: **1234**

            ### المتطلبات: Android 8.0+
            ## (أرشيف) v53.0.0 🧑‍💼 (مستشار حقيقي يفكّر بالأرقام)

            ### المستشار صار خبير كافيهات فعلياً (لا قوالب جاهزة)
            محرك تشخيص يفحص بياناتك ويُنتج تقريراً مرتّباً بالأولوية:
            - 🔢 **يُكمّم كل مشكلة بالـ JD/شهر** ويرتّبها (الأكبر أثراً أولاً) + مجموع الفرصة الشهرية
            - 🔗 **يربط الأسباب**: مثال «تكلفة بضاعتك 54٪ — السبب المرجّح: مورد X ارتفعت فاتورته 40٪»
            - 📐 **بمعايير القطاع العالمية**: بضاعة 28–35٪ · عمالة ≤30٪ · التكلفة الأولية (Prime) ≤60٪ · هامش 15–20٪
            - 🧮 **رياضيات عادلة**: يقيس التكاليف الثابتة (الرواتب) مقابل البيع الشهري المتوقّع لا أيام معدودة
            - يكشف: خسارة، عجز/فائض صندوق، التزامات معلّقة، متفرقات مرتفعة، تراجع داخل الشهر، يوم أسبوع ضعيف، تركّز مورّد، ومنتجات مسعّرة بأقل من تكلفتها — مع **قرار عملي مُكمَّم لكل بند**

            اسأله: «شخّص وضعي» · «ما المشاكل؟» · «حلّل وأعطني خطة» — أو استخدم زر **🩺 شخّص وضعي**. يعمل أوفلاين بلا أي مفتاح، ويجيب الأسئلة المحدّدة من بياناتك مباشرةً.

            ### من v52
            - تبويب الإعدادات الموحّد · دليل البدء · المنيو والتسعير

            ### ⚠️ التثبيت
            1. **احذف القديم** ثم ثبّت `rayhana-cafe-v53.0.0-debug.apk`
            2. تأكّد من ظهور **«الإصدار v53»** أعلى لوحة التحكم
            3. كلمة المرور: **1234**

            ### المتطلبات: Android 8.0+
            ## (أرشيف) v52.0.0 🧭

            ### تنظيم وإعدادات
            - ⚙️ **تبويب «الإعدادات» موحّد**: كلمة المرور · النسخ الاحتياطي · المزامنة السحابية · المستشار الذكي · المخزون · التقرير السنوي · سجل التعديلات — كلها في مكان واحد
            - 🔎 **اكتشاف الأقسام**: أقسام كانت مخفية (المخزون، السنوي) صارت ظاهرة في الإعدادات
            - 🧹 نقل «سجل التعديلات» إلى الإعدادات لتخفيف الشريط العلوي

            ### دليل البدء (Onboarding)
            - 🚀 **قائمة إعداد موجَّهة** على لوحة التحكم للمستخدم الجديد: التزامات · موظفون · هدف · أول إيراد · منيو · سحابة — كل خطوة تنقلك لمكانها وتُعلَّم تلقائياً عند إنجازها (قابلة للإخفاء، وتُفتح من الإعدادات)

            ### إضافة
            - ☕ **تبويب المنيو والتسعير** (هندسة المنيو): أسعار وتكاليف المنتجات + تصنيف نجوم/أحصنة/ألغاز/كلاب + هامش كل منتج

            ### من v51
            - إصلاح تعطّل المستشار (تكرار لا نهائي) · مقارنة الأيام بالشهر الماضي · مقارنة الفطر/الأضحى · Excel أوفلاين

            ### ⚠️ التثبيت
            1. **احذف النسخة القديمة أولاً** ثم ثبّت `rayhana-cafe-v52.0.0-debug.apk`
            2. تأكّد أن أعلى لوحة التحكم يظهر **«الإصدار v52»**
            3. كلمة المرور: **1234**

            ### المتطلبات: Android 8.0+
            ## (أرشيف) v51.0.0 🛠️

            ### 🔴 إصلاح حرج
            - **المستشار الذكي كان يتعطّل** (تكرار لا نهائي) في كثير من الأسئلة منذ v47 — أُصلح الآن، ومساعد المحادثة العربي يعمل فعلاً ويجيب من بياناتك

            ### ➕ جديد (طلب المستخدم)
            - 📆 **مقارنة الأيام مع الشهر الماضي** يوماً بيوم (في تبويب التحليل الذكي) مع الفروقات
            - ⚖️ **مقارنة عيد الفطر مقابل الأضحى** (متوسط اليوم) إضافةً لمقارنة العيد عبر السنوات
            - 📗 **Excel احترافي يعمل أوفلاين بالكامل** (ملف .xls منسّق بلا إنترنت ولا مكتبة)
            - 🔢 **رقم الإصدار ظاهر** أعلى لوحة التحكم لتتأكد من نسختك

            ### تذكير: الميزات الموجودة منذ v45–v50
            - تبويب «🧠 التحليل الذكي»: مساعد محادثة · تنبؤ موسمي · محاكي قرارات · تحليل المتفرقات · كشف الشذوذ · ميزانية وتنبيهات · معايير القطاع
            - مقارنة الموردين بالشهر السابق (تبويب الموردون)

