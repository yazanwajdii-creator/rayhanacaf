            ## (أرشيف) v54.0.0 ✨ (تلميع الواجهة + شبكة أمان CI)

            ### واجهة أكثر إرشاداً
            - 📭 **حالات فارغة موجِّهة**: عند فتح المشتريات/الموردين/الالتزامات/السلف بلا بيانات، يظهر إرشاد واضح بأيقونة كبيرة + الإجراء المطلوب («اضغط ➕ ...») بدل «لا توجد بيانات» الصامتة
            - ⚠️ **تأكيد حذف مُكمَّم**: حذف الالتزامات يُظهر الاسم والمبلغ وحالة الدفع؛ حذف المورد ينبّه إن كان مرتبطاً بفواتير مسجّلة
            - الواجهة الآن «تشرح نفسها» للمستخدم الجديد بدل أن تبدو فارغة

            ### شبكة أمان آلية (CI)
            - 🛡️ **اختبارات E2E في كل بناء**: Playwright يفتح التطبيق في متصفح حقيقي، يدخل، يحفظ بيانات، يتنقّل بين كل التبويبات، ويتحقّق من صحة الأرقام — قبل أي APK
            - في هذا الإصدار غير حاجبة (نتائج للمراقبة)؛ ستصبح حاجبة بعد التأكّد من نجاحها → لن يصل أي APK لم يجتز الاختبارات
            - تقرير Playwright يُحفظ في الـ artifacts للمراجعة عند الفشل

