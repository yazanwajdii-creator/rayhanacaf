            **2) تقرير المدير اليومي — جديد كلياً:**
            ست أوراق احترافية في ملف واحد:

            **الورقة 1 — التقرير اليومي للإدارة (الجديدة):**
            جدول لكل يوم في الشهر يعرض:
            - اليوم + التاريخ + **مَن استلم** (يزن/عبدالرحمن)
            - نقد + فيزا + مدفوعات يومية + إجمالي الإيراد
            - مشتريات اليوم + سلف اليوم
            - **صافي اليوم (تقدير)** — مُلوَّن أخضر/أحمر
            - ملاحظات
            + إجمالي الشهر
            + ملخّص: إيرادات، مشتريات، سلف، التزامات مدفوعة، رواتب، صافي ربح، هامش
            + **كاش حسب المُستلِم**: لكل شخص (يزن/عبدالرحمن): إجمالي النقد + عدد الأيام
            + **مشتريات حسب المشتري**: لكل شخص: إجمالي المشتريات + عدد الفواتير

            **الأوراق الأخرى:** الإيرادات اليومية، المشتريات، الرواتب، السلف، الالتزامات.

