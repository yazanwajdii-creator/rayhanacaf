            ## (أرشيف) v55.0.0 📋 (موجز جاهز للمشاركة + بحث أعمق)

            ### 🌟 الميزة الرئيسية: موجز يومي للواتس
            زر واحد أعلى لوحة التحكم → نصّ عربي مرتّب جاهز للنسخ:
            ```
            📊 ريحانة كافيه — موجز 28/5/2026

            🌅 اليوم:
            💰 مبيعات: 245.000 JD (↑ 12٪ من أمس)
            🛒 مشتريات: 60.000 JD
            📈 صافي: 185.000 JD

            📅 الشهر حتى الآن:
            • إيراد: 4,200 JD
            • ربح: 1,150 JD (هامش 27.4٪)
            • أيام التشغيل: 22

            ⚠️ التزامات قريبة:
            • الإيجار يوم 1 (300 JD)
            ```
            - **زرّان**: 📋 نسخ (للّصق اليدوي) أو 📤 مشاركة (يفتح واتساب مباشرة)
            - يقارن اليوم بأمس تلقائياً (↑/↓ بالنسبة المئوية)
            - يُظهر التزامات الـ٥ أيام القادمة فقط (مفيد، غير مزعج)
            - المالك يسأل «كيف حالنا؟» → ٣ ثوانٍ → الإجابة في جيبه

            ### 🔍 بحث أعمق
            - يشمل الآن **السلف عبر كل الأشهر** — ابحث باسم الموظف أو السبب
            - النتائج كما هي: ذكية، مع كشف نية السؤال (كم ربحت / أعلى مورد / كم رواتب)

            ### 🧭 خريطة ملاحة الكود
            رؤوس أقسام بارزة في `<script>` تجعل التنقّل داخل الملف الواحد سريعاً
            (Ctrl+F على «SECTION:» للقفز بين الأقسام). الإبقاء على ملف واحد قرار
            مدروس: PWA يفتح بطلب HTTP واحد، صفر build، APK مضمون بلا مسارات مكسورة.

