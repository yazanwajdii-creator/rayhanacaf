            ### تقرير Excel متكامل بـ ١٣ ورقة احترافية

            عند الضغط على «📗 Excel» في تبويب التقارير، يتولّد ملف `.xlsx` بمعايير المحاسبة الدولية (IFRS — أساس نقدي):

            **١. ملخّص تنفيذي** — صفحة واحدة لجميع المؤشرات الرئيسية، مقارنة مع الشهر السابق، تحذيرات ذكية، مؤشرات الصحة المالية مع تقييم (✅ ممتاز / ⚠️ مقبول / ❌ منخفض)

            **٢. قائمة الدخل (P&L)** — هيكل احترافي:
            - الإيرادات التشغيلية (نقد + فيزا) مع % من الإيراد
            - تكلفة البضاعة المباعة COGS → مجمل الربح
            - المصاريف التشغيلية مفصّلة (رواتب، تشغيل، تسويق، إدارة، التزامات مفصلة)
            - EBITDA → صافي الربح → صافي الربح المُحاسبي الاستحقاقي

            **٣. قائمة التدفقات النقدية** — تدفقات داخلة/خارجة، صافي التدفق التشغيلي، تسوية الرصيد المتوقع مع الفعلي

            **٤. تقرير المدير اليومي** — صف لكل يوم مع «من استلم» (يزن/عبدالرحمن)

            **٥. تحليل الإيرادات** — متوسطات، أيام الذروة والقاع، توزيع حسب المُستلِم

            **٦. تحليل التكاليف** — حسب الفئة + تركّز أكبر ١٠ موردين + مشتريات حسب المشتري

            **٧. الذمم والالتزامات** — ذمم مدينة (pmts + سلف موظفين) + دائنة (التزامات معلّقة + رواتب مستحقة) + صافي رأس المال العامل

            **٨. مؤشرات الأداء (KPIs)** — نسب الربحية، نسب التكاليف، مقارنة بالشهر السابق

            **٩-١٣. تفاصيل تشغيلية:** الإيرادات اليومية، المشتريات، الرواتب، السلف، الالتزامات

