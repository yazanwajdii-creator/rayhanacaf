            عند: تعطيل المزامنة ⇐ استيراد JSON ⇐ إعادة تفعيل المزامنة ⇒ **التطبيق كان يسحب snapshot من السحابة فوق البيانات المُستوردة فيمحوها**.
            البقّ: حماية «50%» كانت تسمح للسحابة بالاستبدال إذا فيها على الأقل نصف بيانات المحلي — وهذا غير كافٍ.

            ### الإصلاحات الجذرية في v59

            **1) قاعدة صارمة جديدة في الـsync:**
            - السحابة لن تستبدل شهراً محلياً إلا إذا فيها **أكثر** فعلاً (أيام مبيعات وفواتير)
            - إن كان المحلي أكمل (مثلاً 27 يوم vs 19 في السحابة) — يُحتفظ بالمحلي ويُدفع للسحابة

            **2) زر «إعادة تفعيل المزامنة» تم تعديله — أصبح آمناً:**
            - يضع علامة «ادفع المحلي أولاً»
            - عند إعادة التحميل، يدفع بياناتك للسحابة قبل أي قراءة منها
            - النتيجة: المحلي ينتصر دائماً بعد الاستيراد

            **3) استيراد JSON يضع علامة force-push تلقائياً:**
            - حتى لو كانت المزامنة معطّلة وقت الاستيراد، التطبيق يتذكّر أن يدفع عند أول تفعيل

            **4) syncPullSafe تفحص العلامة قبل أي سحب:**
            - إن وُجدت علامة force-push، تُلغى عملية السحب وتُدرج عملية رفع بدلاً منها

