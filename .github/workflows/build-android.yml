            ## (أرشيف) v68.0.0 🔒 (محرّك مزامنة جديد — صفر فقد بيانات مُثبَت رياضياً)

            ### إعادة بناء المزامنة بمنطق صحيح (UNION MERGE)

            بعد فقد البيانات المتكرّر، أعدتُ بناء محرّك الدمج من الصفر بمبدأ **الاتحاد** (Union):

            **القاعدة الأساسية:** الدمج يُنتج اتحاد كل السجلات من الجانبين.
            - سجل موجود محلياً فقط → **يُحفظ** (لا يُحذف أبداً)
            - سجل موجود سحابياً فقط → **يُضاف**
            - سجل في الجانبين بنفس المفتاح → **الأكثر محتوى يفوز**، ثم **الأحدث**

            **استحالة فقد البيانات** لأن لا توجد عملية «استبدال» أو «حذف» في الكود.

            ### اختبارات تُثبت السلامة (11 اختبار جديد)

            - ✅ سحابة فارغة + محلي ممتلئ → يحفظ كل المحلي
            - ✅ السحابة فيها أيام مختلفة → يدمج الكل
            - ✅ تعارض: محلي ممتلئ vs سحابة فارغة → المحتوى يفوز
            - ✅ الاتجاه المعكوس (محلي فارغ، سحابة ممتلئة) → استرجاع كامل
            - ✅ `_mt` الأحدث يفوز عند تعارض ممتلئَين
            - ✅ شهر موجود محلياً فقط لا يُحذف أبداً
            - ✅ الفواتير المكرّرة تُدمج (نفس key) ولا تتضاعف
            - ✅ قائمة `lockedMonths`: اتحاد بلا تكرار
            - ✅ تكرارية مزدوجة: `merge(merge(A,B), B) = merge(A,B)` (idempotent)
            - ✅ **السيناريو الحقيقي** (27 يوم محلي + 19 يوم سحابي قديم): النتيجة 27 يوم
            - ✅ دمج الموظفين بالـid

            **النتيجة:** 187/187 اختبار ناجح (كان 176).

            ### طبقات الحماية الإضافية المحفوظة:
            - **snapshot قبل كل pull** في `rh_pre_pull_snapshot` (استرجاع فوري)
            - **حارس عدّ ما بعد الدمج**: إن قلّت البيانات (يستحيل منطقياً)، استرجع snapshot
            - **سجل في log**: عدد الأيام/الفواتير قبل وبعد كل دمج

