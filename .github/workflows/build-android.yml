name: Build Android APK

on:
  push:
    branches: [main, claude/fix-apk-build-github-Q1Fy1, claude/v28-hardened-build]
    paths:
      - 'index.html'
      - 'android/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # v31: حاجز ضدّ تكرار خطأ v28 (renderSalLaw)
      # نتحقق أن السكربت في index.html يُعرَب بنجاح في محرّك V8 الحقيقي
      # قبل أي بناء — إذا فشل، نوقف الـ pipeline فوراً
      - name: Validate index.html JavaScript syntax
        run: |
          set -e
          # استخراج كل ما داخل <script> الكبير (السكربت الرئيسي)
          python3 - <<'PYEOF'
          with open('index.html', 'r', encoding='utf-8') as f:
              html = f.read()
          lines = html.split('\n')
          start = end = None
          for i, line in enumerate(lines):
              if start is None and '<script>' in line and i > 3000:
                  start = i + 1
              elif start and '</script>' in line:
                  end = i
                  break
          if start is None or end is None:
              raise SystemExit('main <script> block not found in index.html')
          with open('/tmp/script_block.js', 'w', encoding='utf-8') as f:
              f.write('\n'.join(lines[start:end]))
          print(f'Extracted main script: lines {start}-{end} ({end-start} lines)')
          PYEOF
          # تحقّق فعلي بـ V8 (نفس محرّك WebView في Android)
          node -e "
            const fs = require('fs');
            const vm = require('vm');
            try {
              new vm.Script(fs.readFileSync('/tmp/script_block.js', 'utf-8'));
              console.log('✅ index.html JS parses cleanly in V8');
            } catch(e) {
              console.error('❌ index.html JS has syntax error:', e.message);
              const m = e.stack.match(/anonymous>:(\\d+)/);
              if(m) console.error('At line ~' + m[1] + ' of extracted script');
              process.exit(1);
            }
          "

      - name: Install Jest dependencies
        run: npm ci --no-audit --no-fund

      - name: Run Jest unit tests
        run: npm test -- --silent

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check connectivity and environment
        run: |
          echo "## Diagnostics" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_STEP_SUMMARY
          echo "Java: $(java -version 2>&1 | head -1)" >> $GITHUB_STEP_SUMMARY
          GM=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "https://dl.google.com/dl/android/maven2/com/android/tools/build/gradle/8.5.2/gradle-8.5.2.pom")
          echo "Google Maven (dl.google.com): $GM" >> $GITHUB_STEP_SUMMARY
          GM2=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "https://maven.google.com/com/android/tools/build/gradle/8.5.2/gradle-8.5.2.pom")
          echo "Google Maven (maven.google.com): $GM2" >> $GITHUB_STEP_SUMMARY
          GR=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "https://services.gradle.org/distributions/gradle-8.7-bin.zip")
          echo "Gradle distribution: $GR" >> $GITHUB_STEP_SUMMARY
          ls ${ANDROID_SDK_ROOT}/platforms/ 2>/dev/null >> $GITHUB_STEP_SUMMARY || echo "no platforms" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          SDKMANAGER=$(find "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" -name "sdkmanager" -type f 2>/dev/null | head -1)
          [ -n "$SDKMANAGER" ] && yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true

      - name: Create local.properties
        run: echo "sdk.dir=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" > android/local.properties

      - name: Sync latest index.html into Android assets
        run: cp index.html android/app/src/main/assets/public/index.html

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: v2-gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: v2-gradle-

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log
          exit ${PIPESTATUS[0]}

      - name: Show build error in summary
        if: failure()
        run: |
          echo "## Build Error" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -A 20 "FAILURE\|What went wrong\|Could not\|error:" /tmp/build.log | head -60 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: /tmp/build.log

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rayhana-cafe-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Publish APK to v36 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v36
          name: ريحانة كافيه v36.0.0
          prerelease: false
          files: android/app/build/outputs/apk/debug/*.apk
          body: |
            ## ريحانة كافيه — الإصدار v36.0.0

            ### 🛡️ محرك مزامنة محصّن (الميزة الكبرى!)
            بُني محرك مزامنة جديد من الصفر بمعايير إنتاج — 0% فقدان بيانات:

            **حماية ضد 10 نقاط ضعف اكتُشفت في v35:**
            1. ✅ **قائمة انتظار دائمة** (localStorage) — تنجو من إعادة التشغيل
            2. ✅ **Compare-and-Swap** — قراءة الـ updated_at قبل الكتابة، يكشف تعديلات الأجهزة الأخرى
            3. ✅ **Validation كاملة** قبل أي pull — تَفحَص:
               - بنية البيانات (months/suppliers/employees مصفوفات)
               - كل شهر فيه sales كمصفوفة
               - **checksum** للكشف عن التلف
            4. ✅ **Compactor**: لو أُضيف 10 طلبات سريعاً، يُجمَّعون لرفعة واحدة
            5. ✅ **Exponential backoff** ذكي: 2s→4s→8s→16s→60s
            6. ✅ **Conflict resolution مع رفع تلقائي** — لو المحلي أحدث، يُرفع لا يُتجاهَل
            7. ✅ **Client ID فريد لكل جهاز** — تمييز التعديلات
            8. ✅ **Sequence number** monotonic — كشف الفقدان
            9. ✅ **Online/offline events** — استئناف فوري عند رجوع الإنترنت
            10. ✅ **استبدال كامل** بدل دمج جزئي — يضمن الاتساق (حذف شهر ينتشر)

            ### من v35 (تستمر)
            - 📊 4 أشهر مضمَّنة (فبراير→مايو 2026) للمقارنة الفعلية

            ### من v34
            - 🧹 حُذفت ميزات POS الوهمية
            - 🎨 شعار جديد + بطاقة ترحيب احترافية
            - 📊 **4 أشهر كاملة مضمَّنة للمقارنة الفعلية**: فبراير + مارس + أبريل + **مايو** (نشط)
            - 🔄 الشهر النشط الافتراضي = مايو 2026
            - 🛒 15 مورد مدمج من البيانات السابقة
            - 💼 6 موظفين (3 شهري + 3 يومي)
            - 📦 94 مشترى موزعة على الأشهر

            ### من v34
            - 🧹 حُذفت ميزات POS الوهمية (forecastCard + shiftSummary)
            - 🎨 شعار جديد لشاشة الدخول (Amiri كاليجرافي)
            - 👋 بطاقة ترحيب على لوحة التحكم (تحية + ميلادي + هجري + مناسبة)

            ### ميزات v32 (تستمر)
            - ☁️ **مزامنة Supabase تلقائية كاملة** (Zero-Setup)

            ### ميزات v31
            - 🇯🇴🕌 التقويم الأردني (عيد الاستقلال، عيد الأضحى، رمضان...)
            - 📆 شاشة "اليوم" - إدخال سريع (Chips + inline + إدخال صوتي 🎤)

            ### ميزات v30
            - 📥 تصدير PDF/Excel/JSON يعمل (DownloadListener)
            - 📋 تقرير حضور من الملاحظات
            - 🛒 فلتر المشتري

            ### بنية تحتية
            - ✅ CI JS validation (يمنع تكرار خطأ v28)
            - 🧪 92 اختبار Jest

            ### التثبيت:
            1. حمّل ملف ‎`rayhana-cafe-v33.0.0-debug.apk`‎ مباشرة
            2. افتح الملف على جهازك
            3. اسمح بتثبيت التطبيقات من مصادر غير معروفة إذا طُلب منك
            4. كلمة المرور: **1234**

            ### المتطلبات:
            - Android 8.0 (API 26) أو أحدث
