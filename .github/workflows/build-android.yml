            ## (أرشيف) v57.0.0 🔧 (إصلاحات بقّ حرجة — لا تجاوز)

            ### 🔴 الإصلاحات الحرجة (٣ بقّات بلّغ عنها يزن في v56)

            **#1 — محلّل الصوت يفهم الأرقام خطأً عند استخدام «ال»**
            البقّ: "النقد 685 الفيزا 123 المدفوعات 40" كان يُفهم كـ "كاش 848، فيزا 163، مدفوعات 40".
            السبب: الـregex كان يطابق "نقد" داخل "النقد" ويبتلع كل الأرقام التالية ويجمعها (685+163=848).
            الإصلاح: إعادة كتابة المنطق على شكل تمشية تدريجية على التوكنات — الكلمة المفتاحية تفتح "دلواً" والأرقام التالية تذهب فيه حتى تظهر كلمة مفتاحية جديدة.
            النتيجة (مختبَرة): "النقد 685 الفيزا 123 المدفوعات 40" → cash=685, visa=123, pmts=40 ✓

            **#2 — تاريخ نموذج المشتريات ثابت على آخر فاتورة**
            البقّ: عند إغلاق نموذج المشتريات ثم إعادة فتحه، التاريخ والمورد والفئة تبقى محفوظة من الفاتورة السابقة. ينسى المستخدم تغيير التاريخ → فواتير اليوم تُسجَّل بتاريخ خاطئ.
            الإصلاح: `closePurchModal` ينظّف الآن `pDate` (إلى اليوم تلقائياً) و `pSupp` (يفرغ) و `pCat` (يعود إلى COGS).

            **#3 — تصدير Excel ينتج ملفاً تالفاً**
            البقّ: MIME type كان `application/vnd.ms-excel;charset=utf-8` — الـ `;charset=utf-8` يجعل Excel يرفض الملف. الجسر إلى Android كان يفقد BOM أيضاً.
            الإصلاح: MIME صار `application/vnd.ms-excel` نظيف + BOM (`﻿`) قبل الـHTML في كلا المسارين (متصفّح + Android bridge).

            ### 🟡 الملاحظات الأخرى (تحقّق صادق)

            **مقارنة مشتريات الفئة + مقارنة مورد معيّن:**
            **موجودتان فعلاً** في تبويب «🛒 المشتريات» و«📦 الموردون»:
            - تبويب الموردين يعرض جدولاً مع **عمود تغيّر vs الشهر السابق** (▲ ارتفاع/▼ انخفاض) لكل مورد + متوسط الفاتورة
            - مجموع كل فئة (COGS/OPS/ADM/MKT/OTHER) ظاهر في «تفصيل الفئات» داخل تبويب المشتريات

            **تحليل المتفرقات (OTHER):**
            **ليس وهمياً** — في تبويب «🧠 التحليل الذكي» → «تحليل المتفرقات»:
            - يحسب القيمة الفعلية، النسبة من الإيراد، أكثر البنود تكلفة
            - يقارن بالشهر السابق
            - يُعطي توصيات سياقية (تحذير >15٪، اقتراح فصل بند إذا >50٪ من المتفرقات)

            **إن كنت لا تجدها** — هذه مشكلة اكتشاف، ليست غياباً. سأبرزها في v58 بزرّ سريع من لوحة التحكم.

