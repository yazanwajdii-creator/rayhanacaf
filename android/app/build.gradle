apply plugin: 'com.android.application'

android {
    namespace 'com.rayhanacafe.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.rayhanacafe.app"
        minSdk 26
        targetSdk 34
        versionCode 82
        versionName "82.0.0"
    }

    // v58: مفتاح debug ثابت مُحفوظ في المستودع — كل بناء يُوقَّع بنفس المفتاح
    // النتيجة: المستخدم يستطيع تثبيت APK جديد فوق القديم بدون إزالة (يحفظ بياناته)
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // اسم APK يحمل رقم الإصدار حتى لا يعامله الهاتف كملف سابق
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "rayhana-cafe-v${defaultConfig.versionName}-${variant.name}.apk"
        }
    }
}

dependencies {
}
