services:
  postgres:
    image: postgres:16-alpine
    container_name: rayhana-pg
    environment:
      POSTGRES_USER: rayhana
      POSTGRES_PASSWORD: rayhana
      POSTGRES_DB: rayhana
    ports:
      - "5432:5432"
    volumes:
      - rayhana-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rayhana"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  rayhana-pgdata:
