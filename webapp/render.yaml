# نشر بضغطة واحدة على Render — يقرأ هذا الملف تلقائياً
# 1) ادفع المستودع إلى GitHub
# 2) على render.com اضغط New + → Blueprint → اختر المستودع
# 3) Render سينشئ Web Service + Postgres بنفس الإعدادات أدناه
services:
  - type: web
    name: rayhana-web
    runtime: node
    rootDir: webapp
    plan: starter
    buildCommand: npm install && npm run migrate
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rayhana-pg
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: APP_PASSWORD
        sync: false   # اضبطه يدوياً من لوحة Render
      - key: SESSION_SECRET
        generateValue: true

databases:
  - name: rayhana-pg
    plan: starter
    postgresMajorVersion: "16"
